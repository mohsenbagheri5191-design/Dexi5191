# Netlify config for Pinly (static site — the app is a single index.html at the root)
[build]
  publish = "."
  # A real command, deliberately. With an empty command and an unchanged file list,
  # Netlify reports "All files already uploaded by a previous deploy with the same
  # commits" and can skip the production deploy entirely. Writing a file that contains
  # the commit ref makes every deploy genuinely distinct, so it always publishes.
  command = "printf 'Pinly build\\ncommit: %s\\nbranch: %s\\nbuilt: %s\\n' \"$COMMIT_REF\" \"$BRANCH\" \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\" > build-info.txt"

# The app HTML must never be served stale — the service worker handles offline.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/supabase/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# SPA-ish fallback: unknown routes serve the app
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
